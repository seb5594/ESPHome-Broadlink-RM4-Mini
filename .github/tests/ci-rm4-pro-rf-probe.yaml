# Same as ci-rm4-pro.yaml, plus the optional 433 MHz research helper, to make
# sure the two layers keep building together. Not meant for flashing.

substitutions:
  name: ci-broadlink-rm4-pro-probe
  friendly_name: CI Broadlink RM4 Pro Probe

packages:
  broadlink_rm4_pro: !include ../../devices/rm4-pro/rm4-pro.yaml
  rf_probe: !include ../../devices/rm4-pro/rf-probe.yaml

wifi:
  ssid: ci-network
  password: ci-password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - id: !extend ota_esphome
    encryption:
