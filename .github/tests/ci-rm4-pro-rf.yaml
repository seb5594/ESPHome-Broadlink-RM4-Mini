# Same as ci-rm4-pro.yaml, plus the experimental 433 MHz radio. The component
# is fetched from GitHub like a user's config would do it; CI passes the commit
# under test as `firmware_ref`. Not meant for flashing.

substitutions:
  name: ci-broadlink-rm4-pro-rf
  friendly_name: CI Broadlink RM4 Pro RF

packages:
  broadlink_rm4_pro: !include ../../esphome-broadlink-rm4-remote-firmware/devices/rm4-pro/rm4-pro.yaml
  rf: !include ../../esphome-broadlink-rm4-remote-firmware/devices/rm4-pro/rf.yaml

wifi:
  ssid: ci-network
  password: ci-password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - id: !extend ota_esphome
    encryption:
