# Used by the CI workflow to validate and build the package from the current
# branch. Not meant for flashing.

substitutions:
  name: ci-broadlink-rm4-mini
  friendly_name: CI Broadlink RM4 Mini

packages:
  broadlink_rm4_mini: !include ../../devices/rm4-mini/rm4-mini.yaml

wifi:
  ssid: ci-network
  password: ci-password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - id: !extend ota_esphome
    encryption:
