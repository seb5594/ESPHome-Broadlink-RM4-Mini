name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The commit under test. Configs that load files from GitHub (the RF
  # component, remote packages) must point at it, not at a moving branch.
  FIRMWARE_URL: ${{ github.server_url }}/${{ github.repository }}
  FIRMWARE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install yamllint
      - run: yamllint --strict .

  # The parts of the RF driver that do not need ESPHome run on the build machine.
  rf-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run
        working-directory: esphome-broadlink-rm4-remote-firmware/components/bl3361
        run: |
          g++ -std=c++20 -I. -Wall -Wextra -Werror -o /tmp/test_bl3361 test/test_bl3361.cpp
          /tmp/test_bl3361

  esphome:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release and whatever is current.
        esphome: ["2026.9.0", "latest"]
        config: [ci-rm4-mini, ci-rm4-pro, ci-rm4-pro-rf]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ matrix.esphome }}-${{ hashFiles('esphome-broadlink-rm4-remote-firmware/platform/**', 'esphome-broadlink-rm4-remote-firmware/common/**', 'esphome-broadlink-rm4-remote-firmware/devices/**/*.yaml') }}
          restore-keys: platformio-${{ matrix.esphome }}-
      - name: Install ESPHome ${{ matrix.esphome }}
        run: |
          if [ "${{ matrix.esphome }}" = "latest" ]; then
            pip install esphome
          else
            pip install "esphome==${{ matrix.esphome }}"
          fi
      - name: Create throwaway secrets
        run: |
          echo "api_encryption_key: \"$(openssl rand -base64 32)\"" > .github/tests/secrets.yaml
      - name: Validate config
        run: esphome -s firmware_url "$FIRMWARE_URL" -s firmware_ref "$FIRMWARE_REF" config .github/tests/${{ matrix.config }}.yaml
      - name: Compile firmware
        run: esphome -s firmware_url "$FIRMWARE_URL" -s firmware_ref "$FIRMWARE_REF" compile .github/tests/${{ matrix.config }}.yaml
      - name: Check IR receiver fix
        run: bash .github/tests/check_receiver_fix.sh .github/tests/.esphome/build

  # Checks that every device file resolves when it is pulled in as a remote
  # package at this very commit, which is how users include it. The RF variant
  # is compiled as well: that exercises the include paths and the component
  # download the way they work outside of a clone.
  remote-package:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: rm4-mini
            files: esphome-broadlink-rm4-remote-firmware/devices/rm4-mini/rm4-mini.yaml
            compile: false
          - device: rm4-pro
            files: esphome-broadlink-rm4-remote-firmware/devices/rm4-pro/rm4-pro.yaml
            compile: false
          # Configs written for release 1.0.0 include this file.
          - device: rm4-mini-v1-shim
            files: broadlink-rm4-mini.yaml
            compile: false
          - device: rm4-pro-rf
            files: "esphome-broadlink-rm4-remote-firmware/devices/rm4-pro/rm4-pro.yaml, esphome-broadlink-rm4-remote-firmware/devices/rm4-pro/rf.yaml"
            compile: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install esphome
      - name: Create throwaway secrets
        run: |
          echo "api_encryption_key: \"$(openssl rand -base64 32)\"" > .github/tests/secrets.yaml
      - name: Render test config
        run: |
          sed -e "s|__REPO__|$FIRMWARE_URL|g" \
              -e "s|__REF__|$FIRMWARE_REF|g" \
              -e "s|__DEVICE__|${{ matrix.device }}|g" \
              -e "s|__FILES__|${{ matrix.files }}|g" \
              .github/tests/ci-remote.yaml > .github/tests/ci-remote-rendered.yaml
      - name: Validate config
        run: esphome config .github/tests/ci-remote-rendered.yaml
      - name: Compile firmware
        if: matrix.compile
        run: |
          esphome compile .github/tests/ci-remote-rendered.yaml
          bash .github/tests/check_receiver_fix.sh .github/tests/.esphome/build
