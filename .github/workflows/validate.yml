name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install yamllint
      - run: yamllint --strict .

  esphome:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release and whatever is current.
        esphome: ["2026.9.0", "latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ matrix.esphome }}-${{ hashFiles('broadlink-rm4-mini.yaml') }}
          restore-keys: platformio-${{ matrix.esphome }}-
      - name: Install ESPHome ${{ matrix.esphome }}
        run: |
          if [ "${{ matrix.esphome }}" = "latest" ]; then
            pip install esphome
          else
            pip install "esphome==${{ matrix.esphome }}"
          fi
      - name: Create throwaway secrets
        run: |
          echo "api_encryption_key: \"$(openssl rand -base64 32)\"" > .github/tests/secrets.yaml
      - name: Validate config
        run: esphome config .github/tests/ci.yaml
      - name: Compile firmware
        run: esphome compile .github/tests/ci.yaml
      - name: Check IR receiver fix
        run: bash .github/tests/check_receiver_fix.sh .github/tests/.esphome/build
