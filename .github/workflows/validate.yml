name: Validate

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install yamllint
      - run: yamllint --strict .

  esphome:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release and whatever is current.
        esphome: ["2026.9.0", "latest"]
        config: [ci-rm4-mini, ci-rm4-pro, ci-rm4-pro-rf-probe]
        exclude:
          # The research helper only needs to build on the current release.
          - esphome: "2026.9.0"
            config: ci-rm4-pro-rf-probe
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ matrix.esphome }}-${{ hashFiles('platform/**', 'common/**', 'devices/**/*.yaml') }}
          restore-keys: platformio-${{ matrix.esphome }}-
      - name: Install ESPHome ${{ matrix.esphome }}
        run: |
          if [ "${{ matrix.esphome }}" = "latest" ]; then
            pip install esphome
          else
            pip install "esphome==${{ matrix.esphome }}"
          fi
      - name: Create throwaway secrets
        run: |
          echo "api_encryption_key: \"$(openssl rand -base64 32)\"" > .github/tests/secrets.yaml
      - name: Validate config
        run: esphome config .github/tests/${{ matrix.config }}.yaml
      - name: Compile firmware
        run: esphome compile .github/tests/${{ matrix.config }}.yaml
      - name: Check IR receiver fix
        run: bash .github/tests/check_receiver_fix.sh .github/tests/.esphome/build

  # Builds nothing. Checks that every device file resolves when it is pulled
  # in as a remote package at this very commit, which is how users include it.
  remote-package:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: [rm4-mini, rm4-pro]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install esphome
      - name: Create throwaway secrets
        run: |
          echo "api_encryption_key: \"$(openssl rand -base64 32)\"" > .github/tests/secrets.yaml
      - name: Render test config
        run: |
          sed -e "s|__REPO__|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}|" \
              -e "s|__REF__|${GITHUB_SHA}|" \
              -e "s|__DEVICE__|${{ matrix.device }}|g" \
              .github/tests/ci-remote.yaml > .github/tests/ci-remote-rendered.yaml
      - name: Validate config
        run: esphome config .github/tests/ci-remote-rendered.yaml
