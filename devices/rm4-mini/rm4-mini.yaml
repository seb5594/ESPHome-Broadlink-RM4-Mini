# Broadlink RM4 Mini / RM4C Mini as a native Home Assistant IR proxy
#
# Hardware:  board RM4_MINI-MAIN-V4.0.1, Wi-Fi module BL3357-P (Realtek RTL8720CF)
# Project:   https://github.com/seb5594/ESPHome-Broadlink-RM4-Mini
#
# This file is the entry point of the device. It holds the pin map and the
# identity, the actual behaviour comes from the shared layers it pulls in.
# Your own device config includes this file as a package and only adds Wi-Fi
# credentials and keys, see example.yaml. Every substitution below can be
# overridden there.

substitutions:
  name: broadlink-rm4-mini
  friendly_name: Broadlink RM4 Mini

  # Pin map, taken from the boot log of the stock firmware.
  pin_ir_tx: PA4
  pin_ir_rx: PA18
  pin_status_led: PA7
  pin_button: PA19

packages:
  rtl8720c: !include ../../platform/rtl8720c/rtl8720c.yaml
  base: !include ../../common/base.yaml
  controls: !include ../../common/controls.yaml
  ir_proxy: !include ../../common/ir-proxy.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: seb5594.broadlink-rm4-mini
    version: ${project_version}
