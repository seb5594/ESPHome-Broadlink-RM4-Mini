# Device config for the ESPHome dashboard (or the ESPHome CLI).
#
# Copy this file into your ESPHome folder, adjust the substitutions and
# put the secrets into your secrets.yaml (see secrets.yaml.example).
# All hardware settings are pulled from the GitHub repository.
#
# The RM4 Pro is under development and only exists on the dev branch so far.

substitutions:
  name: broadlink-rm4-pro
  friendly_name: Broadlink RM4 Pro
  # Raise to 80ms if long air conditioner codes arrive split up.
  # ir_receiver_idle: 25ms

packages:
  broadlink_rm4_pro:
    url: https://github.com/seb5594/ESPHome-Broadlink-RM4-Mini
    ref: dev
    files:
      - devices/rm4-pro/rm4-pro.yaml
      # Optional research helper for the 433 MHz pin, see devices/rm4-pro/README.md
      # - devices/rm4-pro/rf-probe.yaml
    refresh: 1d
  # Working from a local clone instead? Use this line in place of the block above:
  # broadlink_rm4_pro: !include devices/rm4-pro/rm4-pro.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Optional: DNS suffix of your network, e.g. ".iot.lan" (default ".local")
  # domain: !secret wifi_domain
  ap:
    password: !secret fallback_ap_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  # Encrypts OTA updates with the API key above, no extra password needed.
  - id: !extend ota_esphome
    encryption:
