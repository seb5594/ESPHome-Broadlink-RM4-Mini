<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">
  <title>UART wiring for flashing the Broadlink RM4 Mini</title>
  <rect width="760" height="440" rx="14" fill="#ffffff"/>

  <!-- Board, back side -->
  <rect x="40" y="40" width="290" height="330" rx="40" fill="#1f6f43"/>
  <text x="60" y="68" fill="#d8efe1" font-size="13">RM4_MINI-MAIN-V4.0.1 (back)</text>

  <g fill="#ffffff" text-anchor="end" font-weight="600">
    <text x="262" y="85">IOA0</text>
    <text x="262" y="135">IOA13</text>
    <text x="262" y="185">3.3V</text>
    <text x="262" y="235">U2-TX</text>
    <text x="262" y="285">U2-RX</text>
    <text x="262" y="335">GND</text>
  </g>
  <g fill="#d9b44a" stroke="#8a6d1f" stroke-width="2">
    <circle cx="290" cy="80" r="11"/>
    <circle cx="290" cy="130" r="11"/>
    <circle cx="290" cy="180" r="11"/>
    <circle cx="290" cy="230" r="11"/>
    <circle cx="290" cy="280" r="11"/>
    <circle cx="290" cy="330" r="11"/>
  </g>
  <g fill="#3b3b3b">
    <circle cx="290" cy="80" r="4"/>
    <circle cx="290" cy="130" r="4"/>
    <circle cx="290" cy="180" r="4"/>
    <circle cx="290" cy="230" r="4"/>
    <circle cx="290" cy="280" r="4"/>
    <circle cx="290" cy="330" r="4"/>
  </g>

  <!-- Download mode bridge -->
  <path d="M 301 80 C 352 80, 352 180, 301 180" fill="none" stroke="#e8710a" stroke-width="4" stroke-dasharray="9 6" stroke-linecap="round"/>
  <text x="360" y="122" fill="#b35400" font-weight="600">Bridge IOA0 ↔ 3.3V</text>
  <text x="360" y="142" fill="#b35400">only while flashing</text>

  <!-- UART wires -->
  <line x1="301" y1="230" x2="520" y2="230" stroke="#1a73e8" stroke-width="4" stroke-linecap="round"/>
  <line x1="301" y1="280" x2="520" y2="280" stroke="#188038" stroke-width="4" stroke-linecap="round"/>
  <line x1="301" y1="330" x2="520" y2="330" stroke="#3c4043" stroke-width="4" stroke-linecap="round"/>

  <!-- USB-UART adapter -->
  <rect x="520" y="178" width="200" height="214" rx="12" fill="#f1f3f4" stroke="#5f6368" stroke-width="2"/>
  <text x="620" y="202" fill="#202124" text-anchor="middle" font-size="13" font-weight="600">USB-UART adapter (3.3 V)</text>
  <g fill="#202124" font-weight="600">
    <text x="536" y="235">RX</text>
    <text x="536" y="285">TX</text>
    <text x="536" y="335">GND</text>
  </g>
  <text x="536" y="362" fill="#a50e0e" font-size="13" font-weight="600">VCC / 3.3V:</text>
  <text x="536" y="380" fill="#a50e0e" font-size="13">leave unconnected</text>

  <!-- Power note -->
  <text x="40" y="410" fill="#202124" font-size="14">Power the RM4 Mini from its own micro-USB port, not from the adapter.</text>
  <text x="40" y="428" fill="#5f6368" font-size="13">IOA13 must not be pulled to GND.</text>
</svg>
