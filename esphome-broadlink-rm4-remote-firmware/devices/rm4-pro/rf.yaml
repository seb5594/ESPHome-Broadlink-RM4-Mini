# 433 MHz radio of the Broadlink RM4 Pro. EXPERIMENTAL, not confirmed on a
# device yet. Optional: the device works without this file, it only adds RF.
#
# The radio is the separate BL3361 module. This file wires up the pieces:
#
#   uart:    tunes the module (frequency, receive/transmit switch, signal
#            strength). 115200 baud, 8 data bits, even parity, 1 stop bit
#   bl3361:  the external component of this repository, it also owns the raw
#            data pin that carries the demodulated signal in and the signal
#            to transmit out
#
# Evidence (all of it read from the stock firmware dump, see
# docs/devices/rm4-pro.md for how):
#   - The hardware profile of the stock firmware lists `rf` = [9, 0, 90, 20]:
#     the last number is the data pin of the radio, 20 -> PA20. Phdindota's
#     notes name the same pin.
#   - The stock driver talks to the module on UART0 of the RTL8720CF. LibreTiny
#     routes UART0 to PA14 (TX) and PA13 (RX) on this chip, and the logger of
#     this project runs on UART2, so the two do not collide. The pins are the
#     least certain part of this file: if the module stays silent, try the
#     other pad pair of UART0 (TX PA11, RX PA12).
#
# What you get:
#   - Received 433 MHz codes are logged and fired as the Home Assistant event
#     `esphome.<name>_rf_received` with the raw pulse timings in `code`.
#   - The API actions `rf_send_raw`, `rf_set_frequency` and `rf_scan`.
#   - A relative signal strength sensor.
#
# Use it together with rm4-pro.yaml, see rm4-pro.example.yaml.

substitutions:
  # Where the external component is loaded from. Keep both in step with the
  # package reference of rm4-pro.example.yaml.
  firmware_url: https://github.com/seb5594/ESPHome-Broadlink-RM4-Remote-Firmware
  firmware_ref: main

  # Carrier frequency. 433.92 MHz is the usual one in Europe. The module tunes
  # to 305-340 MHz and 430-440 MHz.
  rf_frequency: 433.92MHz

  # Raw data pin of the radio, taken from the profile of the stock firmware.
  pin_rf_data: PA20
  # UART to the radio module, see the note above.
  pin_rf_uart_tx: PA14
  pin_rf_uart_rx: PA13

external_components:
  - source:
      type: git
      url: ${firmware_url}
      ref: ${firmware_ref}
      path: esphome-broadlink-rm4-remote-firmware/components
    components: [bl3361]
    refresh: 1d

uart:
  - id: rf_uart
    tx_pin: ${pin_rf_uart_tx}
    rx_pin: ${pin_rf_uart_rx}
    baud_rate: 115200
    parity: EVEN
    data_bits: 8
    stop_bits: 1

bl3361:
  id: rf
  uart_id: rf_uart
  data_pin: ${pin_rf_data}
  frequency: ${rf_frequency}
  # If a transmitter in reach produces no frames at all, but the log shows the
  # module answering, try inverting the data pin (the idle level is unknown):
  #   data_pin:
  #     number: ${pin_rf_data}
  #     inverted: true
  rssi:
    name: RF Signal Strength
    entity_category: diagnostic
  on_receive:
    - homeassistant.event:
        event: esphome.${name}_rf_received
        data:
          pulses: !lambda "return to_string(x.size());"
          code: !lambda |-
            std::string text;
            for (size_t i = 0; i < x.size(); i++) {
              if (i != 0)
                text += ",";
              text += to_string(x[i]);
            }
            return text;

api:
  homeassistant_services: true
  actions:
    # Sends a raw code as seen in the received event: positive numbers are the
    # signal on, negative ones off, both in microseconds.
    - action: rf_send_raw
      variables:
        code: int[]
        repeat: int
      then:
        - bl3361.send_raw:
            code: !lambda "return code;"
            repeat: !lambda "return repeat;"
    # Retunes the radio, e.g. 868 is not possible, 315.0 or 433.92 are.
    - action: rf_set_frequency
      variables:
        frequency_mhz: float
      then:
        - bl3361.set_frequency:
            frequency: !lambda "return frequency_mhz * 1e6;"
    # Logs the signal strength on the channels around the frequency. Press a
    # remote while it runs to see which channel lights up.
    - action: rf_scan
      then:
        - bl3361.scan:
